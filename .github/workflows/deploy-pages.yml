name: Deploy to GitHub Pages

# The custom domain cyberbunny.thermh.in currently points at Vercel. Until its
# DNS is repointed at GitHub Pages, this workflow publishes to the project-pages
# URL: https://rmhdeveloper.github.io/Cyber-Bunny-Forensics/
#
# OPENROUTER_API_KEY is optional. If the repo secret is set it is inlined into
# the build; if not, the deployed site still works and shows an in-app field
# where each visitor pastes their own OpenRouter key (stored in their browser).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /Cyber-Bunny-Forensics/
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
